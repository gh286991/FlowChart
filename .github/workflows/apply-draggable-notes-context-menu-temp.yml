name: Apply draggable notes and node menu (temporary)

on:
  push:
    branches:
      - feat/draggable-notes-context-menu
    paths:
      - .github/workflows/apply-draggable-notes-context-menu-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/draggable-notes-context-menu
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/apply-draggable-notes-context-menu.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add draggable notes and quiet node actions"
          git push origin HEAD:feat/draggable-notes-context-menu
