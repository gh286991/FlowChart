name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npm run type-check 2>&1 | tee typecheck.log
      - name: Upload type-check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
      - name: Fail when type-check failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
