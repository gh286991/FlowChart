name: Debug typecheck

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          npm run type-check > typecheck.log 2>&1
          echo $? > typecheck.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: |
            typecheck.log
            typecheck.exit
