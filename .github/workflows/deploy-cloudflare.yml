name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Deploy to Cloudflare Workers
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run deploy 2>&1 | tee deploy.log
          exit_code=${PIPESTATUS[0]}
          url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -n 1 || true)
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          exit "$exit_code"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          payload = {
              "status": os.environ.get("DEPLOY_OUTCOME") or "not-run",
              "url": os.environ.get("DEPLOY_URL") or None,
              "runUrl": os.environ.get("RUN_URL"),
              "commit": os.environ.get("COMMIT_SHA"),
              "updatedAt": datetime.now(timezone.utc).isoformat(),
          }
          with open("deployment.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment.json
          git commit -m "chore: record deployment result [skip ci]" || exit 0
          git push

      - name: Mark deployment as failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
