name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

concurrency:
  group: flowchart-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$D1_DATABASE_ID" || (echo "Missing D1_DATABASE_ID" && exit 1)
          test -n "$WORKERS_SUBDOMAIN" || (echo "Missing WORKERS_SUBDOMAIN" && exit 1)
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/g" wrangler.jsonc
          sed -i "s/REPLACE_WITH_SUBDOMAIN/$WORKERS_SUBDOMAIN/g" wrangler.jsonc

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply flowchart-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy Worker
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
