name: Manual deploy to Cloudflare

on: workflow_dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: flowchart-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact verified commit
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$D1_DATABASE_ID" || (echo "Missing D1_DATABASE_ID" && exit 1)
          test -n "$WORKERS_SUBDOMAIN" || (echo "Missing WORKERS_SUBDOMAIN" && exit 1)
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/g" wrangler.jsonc
          sed -i "s/REPLACE_WITH_SUBDOMAIN/$WORKERS_SUBDOMAIN/g" wrangler.jsonc

      - name: Install dependencies
        run: npm install

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply flowchart-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build verified Cloudflare bundle
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_APP_URL: https://flowchart.${{ secrets.WORKERS_SUBDOMAIN }}.workers.dev

      - name: Deploy Worker
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
