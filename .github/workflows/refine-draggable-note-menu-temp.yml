name: Refine draggable note menu (temporary)

on:
  push:
    branches:
      - feat/draggable-notes-context-menu
    paths:
      - .github/workflows/refine-draggable-note-menu-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/draggable-notes-context-menu
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refinements
        run: python3 scripts/refine-draggable-note-menu.py
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refine draggable note and node menu interactions"
          git push origin HEAD:feat/draggable-notes-context-menu
