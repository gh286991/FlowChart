name: Refresh mobile v2 lockfile

on:
  push:
    branches:
      - feat/mobile-editor-v2
    paths:
      - .github/workflows/refresh-mobile-v2-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-editor-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git add package-lock.json
          git commit -m "chore: sync package lock for mobile editor v2"
          git push origin HEAD:feat/mobile-editor-v2
