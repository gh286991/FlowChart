name: Sync npm lockfile (temporary)

on:
  push:
    branches:
      - fix/desktop-note-ime-ai-ux
    paths:
      - .github/workflows/sync-lock-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-note-ime-ai-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate and verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git add package-lock.json
          git commit -m "chore: synchronize package lock"
          git push origin HEAD:fix/desktop-note-ime-ai-ux
