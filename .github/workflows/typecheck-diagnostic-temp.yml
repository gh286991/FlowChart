name: Capture typecheck diagnostics (temporary)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Capture TypeScript output
        run: |
          npm run type-check > typecheck-diagnostic.log 2>&1 || true
          cat typecheck-diagnostic.log
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: typecheck-diagnostic.log
