<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PM2 系列文章心智圖</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: rgba(255,255,255,.92);
      --text: #172033;
      --muted: #64748b;
      --border: #dbe3ef;
      --shadow: 0 12px 30px rgba(31, 41, 55, .10);
      --primary: #1f3a5f;
      --green: #3f7d62;
      --blue: #2f6fa5;
      --purple: #7656a8;
      --danger: #c84949;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(47,111,165,.08), transparent 32%),
        radial-gradient(circle at 85% 10%, rgba(118,86,168,.08), transparent 30%),
        var(--bg);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(14px);
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 250px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), #365f90);
      color: #fff;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: .02em;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
    }

    button, .file-button {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .16s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    button:hover, .file-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(31,41,55,.08);
    }

    button.primary {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    button.danger {
      color: var(--danger);
    }

    .file-button input { display: none; }

    .stage-wrap {
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    .stage-wrap.dragging-canvas { cursor: grabbing; }

    #stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 5000px;
      height: 3500px;
      transform-origin: 0 0;
      will-change: transform;
      background-image:
        linear-gradient(rgba(148,163,184,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,.12) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    #links {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .node {
      position: absolute;
      min-width: 190px;
      max-width: 260px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.98);
      box-shadow: var(--shadow);
      user-select: none;
      cursor: move;
      z-index: 5;
    }

    .node.root {
      min-width: 220px;
      background: linear-gradient(135deg, var(--primary), #304f78);
      color: #fff;
      border-color: transparent;
    }

    .node.branch-green { border-top: 5px solid var(--green); }
    .node.branch-blue { border-top: 5px solid var(--blue); }
    .node.branch-purple { border-top: 5px solid var(--purple); }

    .node.selected {
      outline: 3px solid rgba(47,111,165,.22);
      outline-offset: 3px;
    }

    .node-title {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
      word-break: break-word;
      outline: none;
    }

    .node-title[contenteditable="true"] {
      user-select: text;
      cursor: text;
      background: rgba(255,255,255,.9);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 6px;
      margin: -4px -6px;
    }

    .node-meta {
      margin-top: 7px;
      font-size: 11px;
      color: var(--muted);
    }

    .root .node-meta { color: rgba(255,255,255,.76); }

    .node-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      opacity: 0;
      pointer-events: none;
      transition: .15s ease;
    }

    .node:hover .node-actions,
    .node.selected .node-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .node-actions button {
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      box-shadow: none;
    }

    .hint {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 20;
      max-width: 360px;
      padding: 12px 14px;
      background: rgba(255,255,255,.92);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      backdrop-filter: blur(12px);
    }

    .zoom-box {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: rgba(255,255,255,.92);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .zoom-box button {
      width: 34px;
      padding: 0;
      justify-content: center;
    }

    .zoom-value {
      min-width: 52px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 820px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .toolbar { margin-left: 0; }
      .hint { max-width: 280px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-mark">PM</div>
      <div>
        <h1>PM2 系列文章心智圖</h1>
        <p>可拖曳、可編輯、可新增分支</p>
      </div>
    </div>

    <div class="toolbar">
      <button class="primary" id="addRootChild">＋新增主分支</button>
      <button id="autoLayout">自動排版</button>
      <button id="saveBtn">儲存</button>
      <button id="exportBtn">匯出 JSON</button>
      <label class="file-button">匯入 JSON<input id="importInput" type="file" accept=".json,application/json"></label>
      <button class="danger" id="resetBtn">重設範例</button>
    </div>
  </header>

  <main class="stage-wrap" id="stageWrap">
    <div id="stage">
      <svg id="links"></svg>
    </div>

    <div class="hint">
      <strong>操作方式</strong><br>
      拖曳節點調整位置；按住空白處即可自由平移；滾輪縮放；雙擊文字編輯。
    </div>

    <div class="zoom-box">
      <button id="zoomOut" title="縮小">−</button>
      <div class="zoom-value" id="zoomValue">100%</div>
      <button id="zoomIn" title="放大">＋</button>
      <button id="resetView" title="重設視角">◎</button>
    </div>
  </main>
</div>

<script>
  const STORAGE_KEY = 'pm2-mindmap-v1';

  const initialData = {
    nextId: 30,
    nodes: [
      { id: 1, parentId: null, text: 'PM2 系列文章', x: 680, y: 460, kind: 'root' },

      { id: 2, parentId: 1, text: '第一篇免費文章\\n為什麼需要 PM2？', x: 980, y: 170, kind: 'green' },
      { id: 3, parentId: 2, text: '常見上線問題', x: 1290, y: 70, kind: 'green' },
      { id: 4, parentId: 2, text: 'node server.js 的限制', x: 1290, y: 190, kind: 'green' },
      { id: 5, parentId: 2, text: 'PM2 提供的能力', x: 1290, y: 310, kind: 'green' },

      { id: 6, parentId: 3, text: 'SSH 關閉後程式停止', x: 1530, y: 30, kind: 'green' },
      { id: 7, parentId: 3, text: '當機後不會自動恢復', x: 1530, y: 95, kind: 'green' },
      { id: 8, parentId: 4, text: '沒有程序與 Log 管理', x: 1530, y: 185, kind: 'green' },
      { id: 9, parentId: 4, text: '多核心可能只用到一核', x: 1530, y: 250, kind: 'green' },
      { id: 10, parentId: 5, text: '自動重啟、Cluster、記憶體限制', x: 1530, y: 330, kind: 'green' },

      { id: 11, parentId: 1, text: '第二篇免費文章\\nFork Mode 與 Cluster Mode', x: 980, y: 440, kind: 'blue' },
      { id: 12, parentId: 11, text: 'Fork Mode', x: 1290, y: 410, kind: 'blue' },
      { id: 13, parentId: 11, text: 'Cluster Mode', x: 1290, y: 510, kind: 'blue' },
      { id: 14, parentId: 11, text: '注意事項', x: 1290, y: 610, kind: 'blue' },

      { id: 15, parentId: 12, text: 'Worker、排程、Queue Consumer', x: 1530, y: 395, kind: 'blue' },
      { id: 16, parentId: 13, text: 'HTTP API、NestJS、Express', x: 1530, y: 500, kind: 'blue' },
      { id: 17, parentId: 14, text: 'Session、WebSocket、DB 連線數', x: 1530, y: 605, kind: 'blue' },

      { id: 18, parentId: 1, text: '付費文章\\n正式部署與壓力測試', x: 980, y: 760, kind: 'purple' },
      { id: 19, parentId: 18, text: '確認目前啟動方式', x: 1290, y: 700, kind: 'purple' },
      { id: 20, parentId: 18, text: 'ecosystem.config.js', x: 1290, y: 790, kind: 'purple' },
      { id: 21, parentId: 18, text: 'Docker 與 pm2-runtime', x: 1290, y: 880, kind: 'purple' },
      { id: 22, parentId: 18, text: '壓力測試與結果分析', x: 1290, y: 970, kind: 'purple' },

      { id: 23, parentId: 19, text: 'CPU、Memory、Replicas、啟動指令', x: 1530, y: 690, kind: 'purple' },
      { id: 24, parentId: 20, text: 'instances、exec_mode、max_memory_restart', x: 1530, y: 785, kind: 'purple' },
      { id: 25, parentId: 21, text: 'ECS、Container、PM2 責任邊界', x: 1530, y: 875, kind: 'purple' },
      { id: 26, parentId: 22, text: 'RPS、p95、p99、Error Rate', x: 1530, y: 955, kind: 'purple' },
      { id: 27, parentId: 22, text: 'CPU、Memory、DB Connections', x: 1530, y: 1020, kind: 'purple' }
    ]
  };

  let data = loadData();
  let selectedId = null;
  let scale = 1;
  let panX = 40;
  let panY = 40;

  const stage = document.getElementById('stage');
  const links = document.getElementById('links');
  const stageWrap = document.getElementById('stageWrap');

  function deepCopy(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : deepCopy(initialData);
    } catch {
      return deepCopy(initialData);
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function kindClass(kind) {
    if (kind === 'root') return 'root';
    if (kind === 'green') return 'branch-green';
    if (kind === 'blue') return 'branch-blue';
    return 'branch-purple';
  }

  function render() {
    stage.querySelectorAll('.node').forEach(el => el.remove());

    data.nodes.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${kindClass(node.kind)} ${selectedId === node.id ? 'selected' : ''}`;
      el.dataset.id = node.id;
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';

      const title = document.createElement('div');
      title.className = 'node-title';
      title.innerText = node.text;
      title.title = '雙擊編輯';
      title.addEventListener('dblclick', e => {
        e.stopPropagation();
        title.contentEditable = 'true';
        title.focus();
        document.execCommand('selectAll', false, null);
      });

      title.addEventListener('blur', () => {
        title.contentEditable = 'false';
        node.text = title.innerText.trim() || '未命名節點';
        saveData();
        render();
      });

      title.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') title.blur();
        if (e.key === 'Escape') {
          title.innerText = node.text;
          title.blur();
        }
      });

      const meta = document.createElement('div');
      meta.className = 'node-meta';
      meta.textContent = node.parentId === null ? '中心主題' : '雙擊文字即可編輯';

      const actions = document.createElement('div');
      actions.className = 'node-actions';

      const add = document.createElement('button');
      add.textContent = '＋子節點';
      add.addEventListener('click', e => {
        e.stopPropagation();
        addChild(node.id);
      });

      const del = document.createElement('button');
      del.textContent = '刪除';
      del.className = 'danger';
      del.disabled = node.parentId === null;
      del.addEventListener('click', e => {
        e.stopPropagation();
        deleteNode(node.id);
      });

      actions.append(add, del);
      el.append(title, meta, actions);

      el.addEventListener('mousedown', startDragNode);
      el.addEventListener('click', e => {
        e.stopPropagation();
        selectedId = node.id;
        render();
      });

      stage.appendChild(el);
    });

    requestAnimationFrame(drawLinks);
  }

  function drawLinks() {
    links.innerHTML = '';
    data.nodes.filter(n => n.parentId !== null).forEach(node => {
      const parentEl = stage.querySelector(`.node[data-id="${node.parentId}"]`);
      const childEl = stage.querySelector(`.node[data-id="${node.id}"]`);
      if (!parentEl || !childEl) return;

      const x1 = parentEl.offsetLeft + parentEl.offsetWidth;
      const y1 = parentEl.offsetTop + parentEl.offsetHeight / 2;
      const x2 = childEl.offsetLeft;
      const y2 = childEl.offsetTop + childEl.offsetHeight / 2;
      const mid = x1 + Math.max(48, (x2 - x1) * .48);

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-width', node.parentId === 1 ? '4' : '2.2');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('opacity', node.parentId === 1 ? '.68' : '.46');

      const stroke = node.kind === 'green'
        ? getComputedStyle(document.documentElement).getPropertyValue('--green')
        : node.kind === 'blue'
          ? getComputedStyle(document.documentElement).getPropertyValue('--blue')
          : getComputedStyle(document.documentElement).getPropertyValue('--purple');
      path.setAttribute('stroke', stroke.trim());

      links.appendChild(path);
    });
  }

  function startDragNode(e) {
    if (e.target.closest('button') || e.target.isContentEditable) return;
    e.preventDefault();

    const id = Number(e.currentTarget.dataset.id);
    const node = data.nodes.find(n => n.id === id);
    if (!node) return;

    selectedId = id;
    const startX = e.clientX;
    const startY = e.clientY;
    const originX = node.x;
    const originY = node.y;

    function move(ev) {
      node.x = originX + (ev.clientX - startX) / scale;
      node.y = originY + (ev.clientY - startY) / scale;
      const el = stage.querySelector(`.node[data-id="${id}"]`);
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      drawLinks();
    }

    function up() {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      saveData();
      render();
    }

    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  }

  function addChild(parentId) {
    const parent = data.nodes.find(n => n.id === parentId);
    if (!parent) return;

    const siblings = data.nodes.filter(n => n.parentId === parentId);
    const id = data.nextId++;
    const kind = parent.kind === 'root' ? ['green','blue','purple'][siblings.length % 3] : parent.kind;

    data.nodes.push({
      id,
      parentId,
      text: parent.kind === 'root' ? '新的主分支' : '新的子節點',
      x: parent.x + 300,
      y: parent.y + siblings.length * 90,
      kind
    });

    selectedId = id;
    saveData();
    render();
  }

  function deleteNode(id) {
    const node = data.nodes.find(n => n.id === id);
    if (!node || node.parentId === null) return;

    const descendants = new Set([id]);
    let changed = true;
    while (changed) {
      changed = false;
      data.nodes.forEach(n => {
        if (n.parentId !== null && descendants.has(n.parentId) && !descendants.has(n.id)) {
          descendants.add(n.id);
          changed = true;
        }
      });
    }

    data.nodes = data.nodes.filter(n => !descendants.has(n.id));
    selectedId = null;
    saveData();
    render();
  }

  function autoLayout() {
    const root = data.nodes.find(n => n.parentId === null);
    if (!root) return;

    root.x = 120;
    root.y = 430;

    const childrenMap = new Map();
    data.nodes.forEach(n => {
      if (n.parentId !== null) {
        if (!childrenMap.has(n.parentId)) childrenMap.set(n.parentId, []);
        childrenMap.get(n.parentId).push(n);
      }
    });

    const roots = childrenMap.get(root.id) || [];
    const branchSpacing = 320;
    const levelSpacing = 300;
    const startY = 70;

    roots.forEach((branch, branchIndex) => {
      const baseY = startY + branchIndex * branchSpacing;
      branch.x = 430;
      branch.y = baseY;

      const level2 = childrenMap.get(branch.id) || [];
      level2.forEach((child, i) => {
        child.x = 760;
        child.y = baseY - 70 + i * 95;

        const level3 = childrenMap.get(child.id) || [];
        level3.forEach((grand, j) => {
          grand.x = 1080;
          grand.y = child.y + j * 70;
        });
      });
    });

    saveData();
    render();
    panX = 70;
    panY = 40;
    applyViewport();
  }

  function exportJson() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pm2-mindmap.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importJson(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!Array.isArray(imported.nodes)) throw new Error('格式錯誤');
        data = imported;
        saveData();
        render();
      } catch {
        alert('匯入失敗：請確認是由本頁匯出的 JSON 檔。');
      }
    };
    reader.readAsText(file);
  }

  function applyViewport() {
    stage.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    document.getElementById('zoomValue').textContent = Math.round(scale * 100) + '%';
  }

  function setScale(next, clientX = null, clientY = null) {
    const oldScale = scale;
    const nextScale = Math.max(.35, Math.min(2, next));
    if (nextScale === oldScale) return;

    const rect = stageWrap.getBoundingClientRect();
    const anchorX = clientX ?? (rect.left + rect.width / 2);
    const anchorY = clientY ?? (rect.top + rect.height / 2);

    const localX = (anchorX - rect.left - panX) / oldScale;
    const localY = (anchorY - rect.top - panY) / oldScale;

    scale = nextScale;
    panX = anchorX - rect.left - localX * scale;
    panY = anchorY - rect.top - localY * scale;

    applyViewport();
  }

  function resetView() {
    scale = 1;
    panX = 40;
    panY = 40;
    applyViewport();
  }

  document.getElementById('addRootChild').addEventListener('click', () => addChild(1));
  document.getElementById('autoLayout').addEventListener('click', autoLayout);
  document.getElementById('saveBtn').addEventListener('click', () => {
    saveData();
    const btn = document.getElementById('saveBtn');
    const old = btn.textContent;
    btn.textContent = '已儲存';
    setTimeout(() => btn.textContent = old, 900);
  });
  document.getElementById('exportBtn').addEventListener('click', exportJson);
  document.getElementById('importInput').addEventListener('change', e => {
    if (e.target.files[0]) importJson(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('確定要重設成最初範例嗎？目前修改會被覆蓋。')) return;
    data = deepCopy(initialData);
    selectedId = null;
    saveData();
    render();
  });

  document.getElementById('zoomOut').addEventListener('click', () => setScale(scale - .1));
  document.getElementById('zoomIn').addEventListener('click', () => setScale(scale + .1));
  document.getElementById('resetView').addEventListener('click', resetView);

  // 點擊空白處取消選取
  stage.addEventListener('click', e => {
    if (e.target !== stage && e.target !== links) return;
    selectedId = null;
    render();
  });

  // 真正的自由畫布：拖曳空白區域可向任何方向平移
  let isPanning = false;
  let panStartX = 0;
  let panStartY = 0;
  let originPanX = 0;
  let originPanY = 0;

  function canStartPan(e) {
    const isMiddleMouse = e.button === 1;
    const isBlankArea = e.button === 0 &&
      !e.target.closest('.node') &&
      !e.target.closest('button') &&
      !e.target.closest('label');

    return isMiddleMouse || isBlankArea;
  }

  stageWrap.addEventListener('mousedown', e => {
    if (!canStartPan(e)) return;

    e.preventDefault();
    isPanning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    originPanX = panX;
    originPanY = panY;
    stageWrap.classList.add('dragging-canvas');
  });

  window.addEventListener('mousemove', e => {
    if (!isPanning) return;

    panX = originPanX + (e.clientX - panStartX);
    panY = originPanY + (e.clientY - panStartY);
    applyViewport();
  });

  window.addEventListener('mouseup', () => {
    if (!isPanning) return;
    isPanning = false;
    stageWrap.classList.remove('dragging-canvas');
  });

  // 觸控：空白處單指拖曳平移
  let touchPan = null;

  stageWrap.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    if (e.target.closest('.node') || e.target.closest('button') || e.target.closest('label')) return;

    const touch = e.touches[0];
    touchPan = {
      x: touch.clientX,
      y: touch.clientY,
      panX,
      panY
    };
    stageWrap.classList.add('dragging-canvas');
  }, { passive: true });

  stageWrap.addEventListener('touchmove', e => {
    if (!touchPan || e.touches.length !== 1) return;
    e.preventDefault();

    const touch = e.touches[0];
    panX = touchPan.panX + (touch.clientX - touchPan.x);
    panY = touchPan.panY + (touch.clientY - touchPan.y);
    applyViewport();
  }, { passive: false });

  stageWrap.addEventListener('touchend', () => {
    touchPan = null;
    stageWrap.classList.remove('dragging-canvas');
  }, { passive: true });

  // 滾輪直接縮放，縮放中心跟著滑鼠位置
  stageWrap.addEventListener('wheel', e => {
    e.preventDefault();

    const zoomFactor = Math.exp(-e.deltaY * 0.0015);
    setScale(scale * zoomFactor, e.clientX, e.clientY);
  }, { passive: false });

  window.addEventListener('resize', drawLinks);
  applyViewport();
  render();
</script>
</body>
</html>
